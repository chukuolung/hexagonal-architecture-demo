spring:
  application:
    name: ddd-hexagonal-architecture
  
  # 資料庫配置
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2 控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console

# 伺服器配置
server:
  port: 8080

# 日誌配置
logging:
  level:
    com.example.ddd: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n" 