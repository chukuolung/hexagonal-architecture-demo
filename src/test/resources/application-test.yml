spring:
  profiles:
    active: test
  
  # 測試環境資料庫配置
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# 測試環境日誌配置
logging:
  level:
    com.example.ddd: DEBUG
    org.springframework.web: WARN 